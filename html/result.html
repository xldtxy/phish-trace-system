<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>检测结果与溯源反制</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
    <style>
        body { background: #f4f6f9; }
        .box { margin-top: 40px; }
    </style>
</head>
<body>
<div class="container box">
    <div class="card">
        <h3>钓鱼邮件检测结果</h3>
        <hr>
        <a href="index.html" class="btn btn-default">返回首页</a>
        <a href="upload.html" class="btn btn-default">继续上传</a>
    </div>

    <!-- 邮件信息 -->
    <div class="card">
        <h4>邮件基本信息</h4>
        <p>发件人：<span id="fromMail">fake@test.com</span></p>
        <p>邮件主题：<span id="mailTitle">账户异常紧急通知</span></p>
        <p>风险等级：<span class="text-danger">高风险 - 钓鱼邮件</span></p>
    </div>

    <!-- 操作按钮 -->
    <div class="card">
        <button id="traceBtn" class="btn btn-warning">一键智能溯源</button>
        <!-- <button id="antiBtn" class="btn btn-danger">一键执行反制</button> -->
    </div>

    <!-- 溯源结果展示 -->
    <div class="card" id="traceRes" style="display:none;">
        <h4>溯源分析结果</h4>
        <p>IP归属地：未知境外节点</p>
        <p>域名信息：恶意备案缺失</p>
        <p>攻击链路：匿名IP → 恶意域名 → 钓鱼邮件</p>
    </div>

    <!-- 反制结果展示 -->
    <div class="card" id="antiRes" style="display:none;">
        <h4>反制执行结果</h4>
        <p>已拉黑恶意IP</p>
        <p>已上报恶意域名</p>
        <p>已加入全局黑名单</p>
    </div>
</div>

<script>
// 一键溯源 点击显示溯源结果
$("#traceBtn").click(function(){
    $("#traceRes").slideDown();
    alert("溯源完成，已生成攻击链路");
});

// // 一键反制 点击显示反制结果
// $("#antiBtn").click(function(){
//     $("#antiRes").slideDown();
//     alert("反制操作执行完成");
// });
</script>
</body>
</html>
