<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>邮件上传检测</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
    <style>
        body { background: #f4f6f9; }
        .box { margin-top: 60px; }
    </style>
</head>
<body>
<div class="container box">
    <div class="card">
        <h3>邮件上传 & 大模型智能检测</h3>
        <hr>
        <a href="index.html" class="btn btn-default">返回首页</a>
        <hr>

        <div class="form-group">
            <label>选择 EML 邮件文件：</label>
            <input type="file" id="mailFile" accept=".eml" class="form-control">
        </div>

        <button id="submitBtn" class="btn btn-primary">开始检测</button>
        <hr>
        <div id="tip"></div>
    </div>
</div>

<script>
// 点击检测
$("#submitBtn").click(function(){
    let file = $("#mailFile")[0].files[0];
    if(!file){
        $("#tip").html('<span class="text-danger">请先选择邮件文件</span>');
        return;
    }

    // 构造表单数据
    let formData = new FormData();
    formData.append("file", file);

    $("#tip").html('<span class="text-info">正在上传并检测，请稍等...</span>');

    // 对接后端接口 后端跑在 127.0.0.1:5000
    $.ajax({
        url: "http://127.0.0.1:5000/upload",
        type: "POST",
        data: formData,
        processData: false,
        contentType: false,
        success: function(res){
            $("#tip").html('<span class="text-success">检测成功，正在跳转结果页...</span>');
            // 跳转到结果页
            setTimeout(function(){
                window.location.href = "result.html";
            }, 1500);
        },
        error: function(){
            $("#tip").html('<span class="text-danger">请求失败，请检查后端是否启动</span>');
        }
    });
});
</script>
</body>
</html>
