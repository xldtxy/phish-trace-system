<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>邮件上传检测 - 钓鱼邮件溯源与反制系统</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://cdn.staticfile.org/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.staticfile.org/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        body { background: #f4f6f9; }
        .main-box { margin-top: 50px; }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 8px #ddd;
            margin-bottom: 20px;
        }
        .tip-text { color: #999; margin-top: 15px; }
        .result-box { display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .risk-high { color: #d9534f; font-weight: bold; }
        .risk-medium { color: #f0ad4e; font-weight: bold; }
        .risk-low { color: #5cb85c; font-weight: bold; }
        .result-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
        }
        .result-section h5 {
            margin-top: 0;
            color: #333;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>
<div class="container main-box">
    <h2 class="text-center">邮件上传 & 大模型智能检测</h2>
    <hr>
    <div class="card">
        <p><a href="/" class="btn btn-default">返回首页</a></p>
        <div class="form-group">
            <label>选择 EML 邮件文件：</label>
            <input type="file" id="emailFile" accept=".eml" class="form-control">
        </div>
        <button id="startBtn" class="btn btn-primary btn-lg">开始检测</button>
        <p id="tip" class="tip-text"></p>
        <div id="resultBox" class="result-box">
            <h4>检测结果</h4>

            <div class="result-section">
                <h5>邮件基本信息</h5>
                <p><strong>发件人：</strong><span id="resFrom">-</span></p>
                <p><strong>收件人：</strong><span id="resTo">-</span></p>
                <p><strong>邮件主题：</strong><span id="resSubject">-</span></p>
                <p><strong>发送时间：</strong><span id="resDate">-</span></p>
            </div>

            <div class="result-section">
                <h5>风险检测结果</h5>
                <p><strong>风险等级：</strong><span id="resRisk" class="risk-high">-</span></p>
                <p><strong>置信度：</strong><span id="resConfidence">-</span></p>
                <p><strong>判定理由：</strong><span id="resReason">-</span></p>
            </div>

            <div class="result-section">
                <h5>溯源概览</h5>
                <p><strong>溯源公网IP：</strong><span id="resIpCount">-</span> 个</p>
                <p><strong>溯源域名：</strong><span id="resDomainCount">-</span> 个</p>
            </div>

            <div style="margin-top: 20px;">
                <a href="/result" class="btn btn-warning btn-lg" id="viewDetailBtn">查看详细溯源结果</a>
                <button class="btn btn-default btn-lg" onclick="resetForm()">重新检测</button>
            </div>
        </div>
    </div>
</div>
<script>
    $(function() {
        $("#startBtn").click(function() {
            const fileInput = $("#emailFile")[0];
            if (!fileInput.files || fileInput.files.length === 0) {
                $("#tip").text("请先选择.eml格式的邮件文件");
                return;
            }
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            $("#startBtn").attr("disabled", true).text("检测中...");
            $("#tip").text("正在解析邮件并执行智能检测，请稍候...");
            $("#resultBox").hide();
            $("#viewDetailBtn").hide();

            $.ajax({
                url: "/api/upload",
                type: "POST",
                data: formData,
                dataType: "json",
                // 文件上传必填配置，禁止jQuery自动处理数据和设置Content-Type
                contentType: false,
                processData: false,
                success: function(res) {
                    $("#startBtn").attr("disabled", false).text("开始检测");
                    if (res.success) {
                        $("#tip").text("检测完成");

                        // 填充邮件信息
                        $("#resFrom").text(res.email.from || "未知");
                        $("#resTo").text(res.email.to || "未知");
                        $("#resSubject").text(res.email.subject || "无主题");
                        $("#resDate").text(res.email.date || "未知");

                        // 填充检测结果
                        const detect = res.detection;
                        const $risk = $("#resRisk");
                        $risk.text(detect.risk_level || "未知");
                        $risk.removeClass("risk-high risk-medium risk-low");
                        if (detect.risk_level && detect.risk_level.indexOf("高") >= 0) {
                            $risk.addClass("risk-high");
                        } else if (detect.risk_level && detect.risk_level.indexOf("中") >= 0) {
                            $risk.addClass("risk-medium");
                        } else {
                            $risk.addClass("risk-low");
                        }

                        $("#resConfidence").text((detect.confidence * 100).toFixed(1) + "%");
                        $("#resReason").text(detect.reason || "无");

                        // 填充溯源概览
                        const trace = res.trace;
                        $("#resIpCount").text(trace.ips ? trace.ips.length : 0);
                        $("#resDomainCount").text(trace.domains ? trace.domains.length : 0);

                        // 保存结果到localStorage，供结果页使用
                        try {
                            localStorage.setItem('lastDetectionResult', JSON.stringify({
                                email: res.email,
                                detection: res.detection,
                                trace: res.trace,
                                record_id: res.record_id
                            }));
                            $("#viewDetailBtn").show();
                        } catch(e) {
                            console.log("保存本地存储失败", e);
                        }

                        $("#resultBox").slideDown();
                    } else {
                        $("#tip").text("检测失败：" + res.error);
                    }
                },
                error: function(xhr) {
                    $("#startBtn").attr("disabled", false).text("开始检测");
                    try {
                        const err = JSON.parse(xhr.responseText);
                        $("#tip").text("请求失败：" + (err.error || "未知错误"));
                    } catch {
                        $("#tip").text("请求失败，请检查后端服务是否正常运行");
                    }
                }
            });
        });
    });

    function resetForm() {
        $("#emailFile").val('');
        $("#resultBox").hide();
        $("#tip").text('');
        $("#viewDetailBtn").hide();
    }
</script>
</body>
</html>
