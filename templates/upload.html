<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>邮件上传检测 - 钓鱼邮件溯源与反制系统</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://cdn.staticfile.org/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.staticfile.org/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        body { background: #f4f6f9; }
        .main-box { margin-top: 50px; }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 8px #ddd;
            margin-bottom: 20px;
        }
        .tip-text { color: #999; margin-top: 15px; }
        .result-box { display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>
<div class="container main-box">
    <h2 class="text-center">邮件上传 & 大模型智能检测</h2>
    <hr>

    <div class="card">
        <p><a href="/" class="btn btn-default">返回首页</a></p>

        <div class="form-group">
            <label>选择 EML 邮件文件：</label>
            <input type="file" id="emailFile" accept=".eml" class="form-control">
        </div>

        <button id="startBtn" class="btn btn-primary btn-lg">开始检测</button>
        <p id="tip" class="tip-text"></p>

        <div id="resultBox" class="result-box">
            <h4>检测结果</h4>
            <div id="resultContent"></div>
        </div>
    </div>
</div>

<script>
    $(function() {
        $("#startBtn").click(function() {
            const fileInput = $("#emailFile")[0];
            if (!fileInput.files || fileInput.files.length === 0) {
                $("#tip").text("请先选择.eml格式的邮件文件");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            $("#startBtn").attr("disabled", true).text("检测中...");
            $("#tip").text("正在解析邮件并执行智能检测，请稍候...");
            $("#resultBox").hide();

            $.ajax({
                url: "/api/upload",
                type: "POST",
                data: formData,
                dataType: "json",
                // 文件上传必填配置，禁止jQuery自动处理数据和设置Content-Type
                contentType: false,
                processData: false,
                success: function(res) {
                    $("#startBtn").attr("disabled", false).text("开始检测");
                    if (res.success) {
                        $("#tip").text("检测完成");
                        const detect = res.detection;
                        const trace = res.trace;
                        $("#resultContent").html(`
                            <p><strong>发件人：</strong>${res.email.from}</p>
                            <p><strong>邮件主题：</strong>${res.email.subject}</p>
                            <p><strong>风险等级：</strong><span class="text-danger">${detect.risk_level}</span></p>
                            <p><strong>置信度：</strong>${detect.confidence}</p>
                            <p><strong>判定理由：</strong>${detect.reason}</p>
                            <p><strong>溯源公网IP：</strong>${trace.ips.length} 个</p>
                        `);
                        $("#resultBox").show();
                    } else {
                        $("#tip").text("检测失败：" + res.error);
                    }
                },
                error: function() {
                    $("#startBtn").attr("disabled", false).text("开始检测");
                    $("#tip").text("请求失败，请检查后端服务是否正常运行");
                }
            });
        });
    });
</script>
</body>
</html>
