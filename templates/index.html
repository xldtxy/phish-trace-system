<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>钓鱼邮件溯源与反制系统</title>
    <!-- 替换为国内静态资源CDN，解决境外无法访问问题 -->
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://cdn.staticfile.org/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.staticfile.org/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        body { background: #f4f6f9; }
        .main-box { margin-top: 50px; }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 8px #ddd;
            margin-bottom: 20px;
        }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #337ab7;
        }
        .stat-label {
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="container main-box">
    <h2 class="text-center">基于大模型的钓鱼邮件智能溯源与反制系统</h2>
    <hr>
    <!-- 导航按钮：修正为Flask路由路径 -->
    <div class="card text-center">
        <a href="/upload" class="btn btn-primary btn-lg">邮件上传检测</a>
        &nbsp;&nbsp;
        <a href="/result" class="btn btn-default btn-lg">溯源与反制查看</a>
    </div>
    <!-- 统计面板 -->
    <div class="row">
        <div class="col-md-3">
            <div class="card text-center">
                <div class="stat-number" id="statTotal">0</div>
                <p class="stat-label">总检测邮件</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="stat-number" id="statPhish" style="color: #d9534f;">0</div>
                <p class="stat-label">钓鱼邮件</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="stat-number" id="statTraced" style="color: #f0ad4e;">0</div>
                <p class="stat-label">已溯源</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="stat-number" id="statDefense" style="color: #5cb85c;">0</div>
                <p class="stat-label">已反制</p>
            </div>
        </div>
    </div>
    <p class="text-center text-muted" style="margin-top: 20px;">
        <small>数据实时更新 · 最后刷新时间：<span id="lastUpdate">加载中...</span></small>
    </p>
</div>
<script>
    // 页面加载时获取统计数据
    $(function() {
        loadStats();
        // 每30秒自动刷新一次
        setInterval(loadStats, 30000);
    });

    function loadStats() {
        $.ajax({
            url: "/api/stats",
            type: "GET",
            dataType: "json",
            success: function(res) {
                if (res.success) {
                    const stats = res.stats;
                    // 数字动画效果
                    animateNumber("statTotal", stats.total);
                    animateNumber("statPhish", stats.phish);
                    animateNumber("statTraced", stats.traced);
                    animateNumber("statDefense", stats.defense);

                    const now = new Date();
                    $("#lastUpdate").text(now.toLocaleString('zh-CN'));
                }
            },
            error: function() {
                // 请求失败时不影响页面显示，保持默认值
                $("#lastUpdate").text("数据加载失败");
            }
        });
    }

    // 数字滚动动画
    function animateNumber(elementId, target) {
        const $el = $("#" + elementId);
        const current = parseInt($el.text()) || 0;
        const duration = 500;
        const steps = 20;
        const increment = (target - current) / steps;
        let step = 0;

        const timer = setInterval(function() {
            step++;
            const value = Math.round(current + increment * step);
            $el.text(value);
            if (step >= steps) {
                clearInterval(timer);
                $el.text(target);
            }
        }, duration / steps);
    }
</script>
</body>
</html>
